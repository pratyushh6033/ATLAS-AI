<!DOCTYPE html>
<html>
<head>
<title>AI Chat - Atlas AI</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#000;
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  color:#00f2fe;
  font-size:18px;
}

/* CHAT WRAPPER */
.chat-container{
  display:flex;
  flex-direction:column;
  height:calc(100vh - 60px);
}

/* MESSAGES */
.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

/* BUBBLES */
.msg{
  max-width:70%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:12px;
  line-height:1.4;
}

.user{
  background:#1a1a1a;
  margin-left:auto;
  border:1px solid rgba(255,255,255,0.1);
}

.ai{
  background:#111;
  border:1px solid #00f2fe33;
}

/* TYPING DOTS */
.typing{
  display:inline-block;
}

.dot{
  width:6px;
  height:6px;
  background:#00f2fe;
  display:inline-block;
  border-radius:50%;
  margin:0 2px;
  animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

@keyframes blink{
  0%,100%{opacity:0.2}
  50%{opacity:1}
}

/* INPUT */
.input-box{
  display:flex;
  padding:15px;
  border-top:1px solid rgba(255,255,255,0.08);
}

input{
  flex:1;
  padding:12px;
  background:#111;
  border:none;
  color:white;
  border-radius:8px;
}

button{
  margin-left:10px;
  padding:12px 16px;
  background:#00f2fe;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
button:hover{
  opacity:0.8;
}
</style>

</head>

<body>

<div class="header">💬 Atlas AI Chat Engine</div>

<div class="chat-container">

<!-- MESSAGES -->
<div class="messages" id="chat">

<div class="msg ai">
👋 Hello! I am Atlas AI.
How can I assist you today?
</div>

<div class="msg user">
What can you do?
</div>

<div class="msg ai">
I can analyze data, generate insights, simulate AI models, and connect to your SaaS system modules.
</div>

</div>

<!-- INPUT -->
<div class="input-box">
<input id="input" placeholder="Ask Atlas AI...">
<button onclick="send()">Send</button>
</div>

</div>

<script>
function send(){

let input = document.getElementById("input");
let chat = document.getElementById("chat");

if(input.value.trim() === "") return;

// USER MESSAGE
let userMsg = document.createElement("div");
userMsg.className = "msg user";
userMsg.innerText = input.value;
chat.appendChild(userMsg);

// AI TYPING
let aiTyping = document.createElement("div");
aiTyping.className = "msg ai";
aiTyping.innerHTML = `
<div class="typing">
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div> thinking...
`;

chat.appendChild(aiTyping);

// scroll
chat.scrollTop = chat.scrollHeight;

let question = input.value;
input.value = "";

// SIMULATE AI RESPONSE
setTimeout(()=>{
aiTyping.remove();

let ai = document.createElement("div");
ai.className = "msg ai";
ai.innerText = "Atlas AI Response: " + question + " → processed successfully.";
chat.appendChild(ai);

chat.scrollTop = chat.scrollHeight;

},1200);

}
</script>

</body>
</html>
